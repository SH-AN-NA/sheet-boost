<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Sheet Boost</title>
  <desc id="desc">Your Striver A2Z sheet, supercharged with quick practice links and progress highlights.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101629"/>
      <stop offset=".55" stop-color="#1b2440"/>
      <stop offset="1" stop-color="#25204a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#80f0ce"/><stop offset="1" stop-color="#80a8ff"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#7d78ff" stop-opacity=".32"/><stop offset="1" stop-color="#7d78ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="330" rx="28" fill="url(#bg)"/>
  <circle cx="1010" cy="42" r="245" fill="url(#glow)"/>
  <circle cx="1120" cy="260" r="190" fill="url(#glow)" opacity=".6"/>
  <g fill="none" stroke="#9bb1ff" stroke-opacity=".13">
    <path d="M0 270 250 20M100 330 430 0M720 330 1050 0M920 330 1200 60"/>
    <path d="M0 292h1200M0 312h1200"/>
  </g>
  <g transform="translate(72 73)">
    <rect width="62" height="62" rx="19" fill="url(#accent)"/>
    <path d="M19 42V20h7l12 14V20h7v22h-7L26 28v14z" fill="#11172a"/>
  </g>
  <text x="72" y="188" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="64" font-weight="750" letter-spacing="-2">Sheet Boost</text>
  <text x="76" y="230" fill="#aebbd9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Your Striver A2Z sheet, supercharged.</text>
  <g transform="translate(78 266)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">
    <rect width="144" height="30" rx="15" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".13"/>
    <text x="17" y="20" fill="#9debd5">VERIFIED LINKS</text>
    <rect x="155" width="165" height="30" rx="15" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".13"/>
    <text x="171" y="20" fill="#b7c5ff">PROGRESS AT A GLANCE</text>
  </g>
  <g transform="translate(805 71)">
    <rect width="300" height="190" rx="18" fill="#101629" fill-opacity=".75" stroke="#a4b4ff" stroke-opacity=".3"/>
    <rect x="18" y="18" width="264" height="34" rx="9" fill="#202a46"/>
    <circle cx="34" cy="35" r="5" fill="#ff7e8b"/><circle cx="51" cy="35" r="5" fill="#ffd16d"/><circle cx="68" cy="35" r="5" fill="#80e3bd"/>
    <text x="91" y="39" fill="#abb8d4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">A2Z PRACTICE SHEET</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">
      <rect x="18" y="67" width="264" height="40" rx="9" fill="#1b2440"/>
      <circle cx="39" cy="87" r="8" fill="#7de0bb"/><path d="m35 87 3 3 6-7" fill="none" stroke="#11251f" stroke-width="2"/>
      <text x="58" y="91" fill="#e5eaff">Two Sum</text>
      <rect x="209" y="77" width="58" height="20" rx="10" fill="#263b52"/><text x="218" y="91" fill="#8de6c7" font-size="9">LEETCODE</text>
      <rect x="18" y="118" width="264" height="40" rx="9" fill="#1b2440"/>
      <circle cx="39" cy="138" r="8" fill="#7de0bb"/><path d="m35 138 3 3 6-7" fill="none" stroke="#11251f" stroke-width="2"/>
      <text x="58" y="142" fill="#e5eaff">Reverse a Linked List</text>
      <rect x="215" y="128" width="52" height="20" rx="10" fill="#3c2d42"/><text x="223" y="142" fill="#ffb1ca" font-size="9">GFG</text>
    </g>
  </g>
  <g fill="#8de6c7">
    <circle cx="751" cy="79" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1148" cy="279" r="3"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="747" cy="241" r="3"><animate attributeName="opacity" values=".2;.9;.2" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>
